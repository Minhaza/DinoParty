name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        # The Maven wrapper lives in backend/, not the repo root.
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Testcontainers uses the Docker available on the runner for the *IT tests.
      - run: ./mvnw -B -ntp verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Playwright suite against the real stack (P7-03): PostgreSQL service + packaged backend jar +
  # Vite dev server (started by playwright.config.ts, proxying /api and /ws to :8080).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dinoparty
          POSTGRES_USER: dinoparty
          # CI-only throw-away database, not a secret.
          POSTGRES_PASSWORD: ci-e2e-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dinoparty -d dinoparty"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      CI: "true"
      DB_URL: jdbc:postgresql://localhost:5432/dinoparty
      DB_USER: dinoparty
      DB_PASSWORD: ci-e2e-password
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      APP_PUBLIC_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Tests already run in the backend job; this only needs the jar.
      - name: Build backend jar
        working-directory: backend
        run: ./mvnw -B -ntp -DskipTests package
      - name: Start backend
        run: |
          jar=$(ls backend/target/*.jar | grep -v '\.original$' | head -n 1)
          nohup java -jar "$jar" > backend.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:8080/api/v1/health | grep -q "\"status\":\"UP\""; then exit 0; fi
            sleep 2
          done
          echo "Backend did not become healthy; log tail:" >&2
          tail -n 80 backend.log >&2
          exit 1
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run Playwright
        working-directory: frontend
        run: npm run e2e
      # Trace + screenshot show the browser/STOMP side, backend.log the server/Flyway/PostgreSQL side.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-diagnostics
          path: |
            frontend/playwright-report/
            frontend/test-results/
            backend.log
          retention-days: 7
