spring:
  application:
    name: dinoparty
  datasource:
    # DB_URL wins; otherwise the URL is assembled from parts (Render hands out host/port/name).
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:dinoparty}}
    username: ${DB_USER:dinoparty}
    password: ${DB_PASSWORD:}
    hikari:
      # Fail fast so the health endpoint answers 503 quickly when the database is unreachable.
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      # Word pack imports are capped at 1 MiB (WordPackLimits); the framework limit sits just above
      # so the service reports the contract's PAYLOAD_TOO_LARGE for files it receives, while a
      # request far beyond is cut off before it is buffered.
      max-file-size: 1100KB
      max-request-size: 1200KB
      file-size-threshold: 2MB

logging:
  level:
    # STOMP frame logging at DEBUG/TRACE prints native headers; keep it off so a bearer token can
    # never reach a log, whatever the root level is.
    org.springframework.messaging: INFO
    org.springframework.web.socket: INFO

server:
  # Hosts such as Render inject PORT.
  port: ${PORT:8080}
  # `native` (set behind Render's proxy, D49) lets Tomcat's RemoteIpValve take the client address
  # from X-Forwarded-For when the peer is a private-range proxy. Off by default: without a trusted
  # proxy the header is client-controlled and would let anyone dodge the per-address rate limits.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  error:
    include-stacktrace: never
    include-message: never

management:
  observations:
    enable:
      # Per-filter Security spans drown the request trace; the HTTP server span is enough.
      spring:
        security: false
  # Optional OTLP export (to the Collector in deploy/compose.observability.yml, see docs/observability.md).
  # Off unless OTEL_ENABLED=true.
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLING_PROBABILITY:1.0}
    export:
      otlp:
        enabled: ${OTEL_ENABLED:false}
  opentelemetry:
    resource-attributes:
      service.name: ${OTEL_SERVICE_NAME:dinoparty-backend}
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/logs
  logging:
    export:
      otlp:
        enabled: ${OTEL_ENABLED:false}
  otlp:
    metrics:
      export:
        enabled: ${OTEL_ENABLED:false}
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        step: ${OTEL_METRICS_EXPORT_INTERVAL:15s}
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

app:
  version: "@project.version@"
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  # Serve the built frontend from this process (single-origin deploy, D49). Off in dev, where Vite
  # serves it. The location is a Spring resource URL ending in '/', e.g. file:/app/static/.
  spa:
    enabled: ${SPA_ENABLED:false}
    location: ${SPA_LOCATION:classpath:/static/}
  # Frontend origin used to build invite links ({APP_PUBLIC_URL}/join/{CODE}).
  public-url: ${APP_PUBLIC_URL:http://localhost:5173}
  guest:
    token-ttl: ${TOKEN_TTL:30d}
  # STOMP lobby layer; durations use Spring syntax (30s, 1m). Defaults are in RealtimeProperties.
  realtime:
    disconnect-grace: ${WS_DISCONNECT_GRACE:30s}
