# Integration tests share one client address and many guests, so relax the throttles;
# dedicated tests lower them again to prove the limits work.
app:
  guest:
    create-limit-per-minute: 100000
  join-limit-per-minute: 100000
  public-url: http://app.test
  realtime:
    disconnect-grace: 1500ms
    sweep-interval: 100ms
    session-recheck-interval: 200ms
    connect-limit-per-minute: 100000
    auth-failure-limit-per-minute: 100000
