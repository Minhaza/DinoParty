# Render Blueprint (decision D49, docs/deployment.md). Free tier: the web service sleeps after
# ~15 min idle and the database expires after 30 days (risks R32-R34).
services:
  - type: web
    name: dinoparty
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health/readiness
    # Deploy from GitHub pushes to this branch only; change to taste.
    branch: main
    envVars:
      - key: PORT
        value: "8080"
      # Render's proxy sits on a private address in front of the container; trust it for the
      # client address (rate limits). Never set this where clients can reach the app directly.
      - key: FORWARD_HEADERS_STRATEGY
        value: native
      - key: DB_HOST
        fromDatabase:
          name: dinoparty-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: dinoparty-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: dinoparty-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: dinoparty-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: dinoparty-db
          property: password
      # The service's own https://<name>.onrender.com URL (shown after the first deploy).
      # WebSocket handshakes check Origin against this list even on the same origin.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: APP_PUBLIC_URL
        sync: false

databases:
  - name: dinoparty-db
    plan: free
    databaseName: dinoparty
    user: dinoparty
    postgresMajorVersion: "16"
