<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" fill="none">
  <defs>
    <linearGradient id="dgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d1fae5" />
      <stop offset="50%" stop-color="#ecfdf5" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>
    <linearGradient id="easelWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <filter id="dgShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#10213d" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="1200" height="700" fill="url(#dgBg)" />

  <!-- Floating Paint Splats / Confetti -->
  <circle cx="150" cy="120" r="14" fill="#f36b36" opacity="0.7" />
  <circle cx="240" cy="200" r="8" fill="#11956b" opacity="0.6" />
  <circle cx="1020" cy="140" r="18" fill="#7565e8" opacity="0.7" />
  <circle cx="1100" cy="220" r="10" fill="#f5b335" opacity="0.8" />
  <circle cx="950" cy="80" r="12" fill="#3aa6d8" opacity="0.6" />

  <!-- Prehistoric Fern in Background -->
  <g fill="#10b981" opacity="0.25">
    <path d="M-50 700 Q150 450 350 420 Q200 550 50 700 Z" />
    <path d="M1250 700 Q1050 450 850 420 Q1000 550 1150 700 Z" />
  </g>

  <!-- Wooden Studio Easel -->
  <g filter="url(#dgShadow)">
    <!-- Rear leg -->
    <rect x="670" y="80" width="22" height="520" rx="6" fill="#78350f" />
    <!-- Left leg -->
    <polygon points="560,600 585,600 680,100 660,100" fill="url(#easelWood)" stroke="#10213d" stroke-width="4" />
    <!-- Right leg -->
    <polygon points="800,600 775,600 680,100 700,100" fill="url(#easelWood)" stroke="#10213d" stroke-width="4" />
    <!-- Horizontal shelf -->
    <rect x="520" y="380" width="320" height="24" rx="8" fill="url(#easelWood)" stroke="#10213d" stroke-width="4" />

    <!-- Stretched Canvas -->
    <rect x="550" y="140" width="260" height="240" rx="14" fill="#fff9f0" stroke="#10213d" stroke-width="5" />

    <!-- Painting on Canvas: Cute erupting volcano with rainbow smoke! -->
    <!-- Distant mountain on canvas -->
    <path d="M570 340 L650 250 L700 300 L790 340 Z" fill="#fdba74" opacity="0.5" />
    <!-- Volcano cone -->
    <polygon points="620,340 680,240 740,340" fill="#92400e" stroke="#10213d" stroke-width="3" />
    <!-- Lava crater -->
    <ellipse cx="680" cy="240" rx="20" ry="8" fill="#f36b36" />
    <!-- Lava drip -->
    <path d="M675 240 Q670 270 675 285 Q685 270 685 240 Z" fill="#ef4444" />
    <!-- Rainbow smoke puffs -->
    <circle cx="680" cy="205" r="14" fill="#fbbf24" opacity="0.85" />
    <circle cx="695" cy="180" r="18" fill="#f43f5e" opacity="0.85" />
    <circle cx="670" cy="165" r="16" fill="#a855f7" opacity="0.85" />
    <circle cx="700" cy="150" r="12" fill="#38bdf8" opacity="0.85" />
  </g>

  <!-- Rex Painting at Easel (Stylized Mascot) -->
  <g filter="url(#dgShadow)">
    <!-- Tail -->
    <path
      d="M240 540 C170 510 130 420 120 340 C150 380 200 420 270 450 Z"
      fill="#11956b"
      stroke="#10213d"
      stroke-width="5"
    />
    <!-- Spikes along tail -->
    <polygon points="135,360 120,340 145,345" fill="#f59e0b" stroke="#10213d" stroke-width="2.5" />
    <polygon points="160,395 140,380 165,385" fill="#f59e0b" stroke="#10213d" stroke-width="2.5" />
    <polygon points="195,430 175,415 200,420" fill="#f59e0b" stroke="#10213d" stroke-width="2.5" />

    <!-- Feet -->
    <ellipse cx="290" cy="560" rx="36" ry="20" fill="#087a58" stroke="#10213d" stroke-width="5" />
    <ellipse cx="380" cy="560" rx="36" ry="20" fill="#087a58" stroke="#10213d" stroke-width="5" />

    <!-- Body -->
    <ellipse cx="340" cy="420" rx="90" ry="110" fill="#11956b" stroke="#10213d" stroke-width="5" />
    <!-- Warm belly -->
    <path
      d="M320 370 C360 370 400 400 410 450 C410 500 370 520 330 520 C300 520 300 430 320 370 Z"
      fill="#86efac"
      opacity="0.75"
    />

    <!-- Head -->
    <path
      d="M340 260 C330 200 380 170 440 180 C480 190 510 230 500 270 C490 310 430 320 370 310 C340 310 340 290 340 260 Z"
      fill="#11956b"
      stroke="#10213d"
      stroke-width="5"
    />
    <!-- Jaw -->
    <path
      d="M420 305 C460 305 490 295 495 270 C460 270 420 280 420 305 Z"
      fill="#087a58"
    />

    <!-- Eye -->
    <circle cx="430" cy="225" r="14" fill="#ffffff" stroke="#10213d" stroke-width="4" />
    <circle cx="436" cy="225" r="8" fill="#10213d" />
    <circle cx="439" cy="222" r="3" fill="#ffffff" />

    <!-- Artist Beret! -->
    <path
      d="M370 190 C360 140 440 130 470 160 C480 180 450 200 400 200 Z"
      fill="#f36b36"
      stroke="#10213d"
      stroke-width="4"
    />
    <circle cx="420" cy="140" r="5" fill="#f59e0b" stroke="#10213d" stroke-width="2" />

    <!-- Left hand holding wooden palette -->
    <g>
      <!-- Arm -->
      <path d="M300 400 Q260 410 240 430" stroke="#11956b" stroke-width="26" stroke-linecap="round" />
      <!-- Wooden Palette -->
      <path
        d="M210 410 C180 390 140 420 150 460 C160 500 210 510 240 480 C260 460 240 430 210 410 Z"
        fill="#fed7aa"
        stroke="#10213d"
        stroke-width="4"
      />
      <circle cx="170" cy="435" r="7" fill="#f43f5e" />
      <circle cx="195" cy="430" r="7" fill="#3b82f6" />
      <circle cx="215" cy="450" r="7" fill="#eab308" />
      <circle cx="180" cy="470" r="7" fill="#a855f7" />
    </g>

    <!-- Right hand holding paintbrush toward canvas -->
    <g>
      <!-- Arm reaching out -->
      <path d="M410 390 Q480 370 540 340" stroke="#11956b" stroke-width="24" stroke-linecap="round" />
      <!-- Paintbrush handle -->
      <line x1="520" y1="355" x2="610" y2="300" stroke="#b45309" stroke-width="7" stroke-linecap="round" />
      <!-- Ferrule & Bristles -->
      <rect x="585" y="308" width="10" height="7" rx="2" fill="#9ca3af" stroke="#10213d" stroke-width="2" transform="rotate(-30 585 308)" />
      <path d="M598 300 C615 290 625 285 630 280 C625 295 615 305 604 310 Z" fill="#38bdf8" stroke="#10213d" stroke-width="2" />
    </g>
  </g>
</svg>
