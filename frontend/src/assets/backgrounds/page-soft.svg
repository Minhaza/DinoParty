  />

  <!-- Faint prehistoric palms at far edges -->
  <g fill="#11956b" opacity="0.08">
    <path d="M-20 1200 C30 1000 120 900 240 850 C200 950 160 1050 80 1200 Z" />
    <path d="M2020 1200 C1970 1000 1880 900 1760 850 C1800 950 1840 1050 1920 1200 Z" />
  </g>
